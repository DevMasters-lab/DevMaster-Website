[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=/usr/local/bin/php artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=200
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
